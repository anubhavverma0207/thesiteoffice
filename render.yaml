# Render Blueprint for the AntCrow studio site (static, always on, free).
# Next.js is exported to ./out and served as static files at antcrow.com.
# NOTE: the service is still NAMED "thesiteoffice" on Render. Do not rename
# it here: a renamed blueprint service would be created as a brand-new
# service and the custom domain would stay on the old one.
services:
  - type: web
    name: thesiteoffice
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # Web3Forms delivery key. It is a PUBLIC key (like a form id), safe to
      # commit and ship in client code; it only routes submissions to the
      # studio inbox. "AntCrow website" form, delivers to hello@antcrow.com.
      - key: NEXT_PUBLIC_WEB3FORMS_KEY
        value: 0b5b7d44-7768-4f87-8d18-2edb71abae56
      # Analytics and webmaster verification. Public identifiers, safe to
      # commit. Fill in after creating each account (see DEPLOY.md), then
      # redeploy; everything no-ops while a value is empty.
      - key: NEXT_PUBLIC_GA_ID
        value: G-S4MK85WD68
      - key: NEXT_PUBLIC_CLARITY_ID
        value: xta4cv60qb
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        value: fw-TIKivfOZBqisqGKTjJRYEBhUvHPNyOXpzANrPchI
      - key: NEXT_PUBLIC_BING_SITE_VERIFICATION
        value: F26FA4F114D973DDD5BBE8AA50B159ED
